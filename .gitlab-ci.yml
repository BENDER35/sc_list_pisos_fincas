stages:
  - mirror

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"

mirror-to-github:
  stage: mirror
  image: alpine:3.20
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script:
    - apk add --no-cache bash git
    - git config --global user.name "sc-list-pisos-fincas mirror"
    - git config --global user.email "mirror@example.com"
  script:
    - bash scripts/mirror_to_github.sh
