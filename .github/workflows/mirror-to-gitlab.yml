name: Mirror to GitLab

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all branches and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        env:
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
        run: bash scripts/mirror_to_gitlab.sh
